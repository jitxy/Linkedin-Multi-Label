<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Multi-Label</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <rect width="24" height="24" rx="4" fill="#0A66C2"/>
      <path d="M7 10h2v7H7v-7zm1-3a1.2 1.2 0 1 1 0 2.4A1.2 1.2 0 0 1 8 7zm4 3h2v1h.03C14.5 10.4 15.4 10 16.5 10c2.2 0 3 1.4 3 3.2V17h-2v-3.4c0-.8-.01-1.8-1.1-1.8-1.1 0-1.4.86-1.4 1.75V17H13v-7z" fill="white"/>
    </svg>
    <div class="popup-title">
      <strong>LinkedIn Multi-Label</strong>
      <span>v1.0.0</span>
    </div>
  </div>

  <div class="popup-actions">
    <button class="action-btn primary" id="btn-open-sidepanel">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M15 3v18"/>
      </svg>
      Open Side Panel
    </button>

    <button class="action-btn" id="btn-open-linkedin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
      </svg>
      Open LinkedIn
    </button>

    <button class="action-btn" id="btn-open-salesnav">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      Open Sales Navigator
    </button>
  </div>

  <div class="popup-footer">
    <a class="footer-link" id="link-issues" href="#">Report an issue</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
